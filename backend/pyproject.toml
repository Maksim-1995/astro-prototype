[project]
name = "astrosynchro-backend"
version = "0.1.0"
description = "Beta-test applications API for AstroSynchro"
requires-python = ">=3.12,<3.15"
dependencies = [
    "django>=5.2.8,<5.3",
    "djangorestframework>=3.16,<3.19",
    "django-cors-headers>=4.7,<5",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<28",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:beta.*"]

[tool.ruff]
target-version = "py312"
line-length = 79
extend-exclude = ["staticfiles"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    "D200", "D201", "D202", "D204", "D205", "D206", "D207", "D208",
    "D209", "D210", "D211", "D212",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

